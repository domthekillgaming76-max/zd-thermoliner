<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Z&D ERP" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z&D Thermoliner ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes zd-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.addEventListener('error', function (e) {
        var boot = document.getElementById('zd-boot');
        if (!boot) return;
        var detail = (e && e.message) ? String(e.message).slice(0, 160) : '';
        boot.innerHTML = '<div style="max-width:420px;text-align:center;padding:24px">'
          + '<p style="color:#fca5a5;font-size:14px;margin:0 0 12px">Erreur de chargement.</p>'
          + (detail ? '<p style="color:#888;font-size:11px;margin:0 0 12px">' + detail + '</p>' : '')
          + '<p style="color:#aaa;font-size:13px;margin:0">Appuyez sur <b>Ctrl+F5</b> pour recharger.</p></div>';
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="zd-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#fff">
        <div style="text-align:center">
          <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#ef4444;border-radius:50%;animation:zd-spin 1s linear infinite;margin:0 auto 16px"></div>
          <p style="opacity:0.5;font-size:14px">Chargement Z&amp;D Thermoliner...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
